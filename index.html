    <meta name="description" content="Paste one 7G firewall log line and see which rule blocked the request, with an exception file scoped to that one request for a GridPane server." />
    <link rel="canonical" href="https://7ghelper.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="7G Helper" />
    <meta property="og:url" content="https://7ghelper.com/" />
    <meta property="og:title" content="7G Firewall Exception Generator" />
    <meta property="og:description" content="Paste one 7G firewall log line and see which rule blocked the request, with an exception file scoped to that one request for a GridPane server." />
    <!-- Share card: Paper file "7G Helper — Social Preview (OG)". Export at 2x, resize to exactly 1200x630, check it at 260px wide. -->
    <meta property="og:image" content="https://7ghelper.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="7G Helper: 7G Firewall Exception Generator for GridPane." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a22" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('7g-helper-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!-- Fathom - beautiful, simple website analytics. Counts 7ghelper.com only, never the pages.dev previews. -->
    <script src="https://cdn.usefathom.com/script.js" data-site="OTSDYTIE" data-included-domains="7ghelper.com" defer></script>
    <!-- / Fathom -->
