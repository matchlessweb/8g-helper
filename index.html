<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8G Firewall Rule Finder | 8G Helper</title>
    <meta name="description" content="Paste an 8G firewall log line and see which rule fired, the exact pattern and the text that matched. Plus a way to run 8G beside 7G on GridPane before you switch." />
    <link rel="canonical" href="https://8ghelper.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="8G Helper" />
    <meta property="og:url" content="https://8ghelper.com/" />
    <meta property="og:title" content="8G Firewall Rule Finder" />
    <meta property="og:description" content="Paste an 8G firewall log line and see which rule fired, the exact pattern and the text that matched. Plus a way to run 8G beside 7G on GridPane before you switch." />
    <!-- Share card: Paper file "8G Helper — Social Preview (OG)". Export at 2x, resize to exactly 1200x630, check it at 260px wide. -->
    <meta property="og:image" content="https://8ghelper.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="8G Helper: 8G Firewall Rule Finder for nginx." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a22" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('8g-helper-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
