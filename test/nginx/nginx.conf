# 8G accuracy harness: nG-SetEnvIf's 8g-firewall.conf in the http block, as GridPane loads it, and one server that
# answers every request with the six map values (headers) and nginx's own $uri and $query_string (body).
# merge_slashes is nginx's default (on), as on GridPane.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    include /rules/8g-firewall.conf;
    access_log off;
    default_type text/plain;
    server {
        listen 8080 default_server;
        server_name _;
        add_header X-Ng-Cookie $bad_cookie_ng always;
        add_header X-Ng-Method $not_allowed_method_ng always;
        add_header X-Ng-Referer $bad_referer_ng always;
        add_header X-Ng-Bot $bad_bot_ng always;
        add_header X-Ng-Querystring $bad_querystring_ng always;
        add_header X-Ng-Request $bad_request_ng always;
        return 200 "<uri>$uri</uri><qs>$query_string</qs>";
    }
}
