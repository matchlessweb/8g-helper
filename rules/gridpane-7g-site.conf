# GridPane's per-site 7G processing, as shipped (/etc/nginx/common/<site>-7g.conf on a GridPane server, 2026-10-21; the server-wide
# /etc/nginx/common/7g.conf is the same with "include /etc/nginx/extra.d/*-7g-context.conf;" in place of the site line).
# The map values set the drop flags; every *7g-context.conf is included after that and before the drop, so an exception
# resets a flag to 0. A site can comment out a group (example.net has bad_referer off).
# #
# GridPane vHost 7G Firewall Site Level processing.
# Modified from https://perishablepress.com/7g/ - Jeff Starr is a Star!
# Version 1.2.0
# #
set $7g_reason "";
set $7g_drop_bad_bot 0;
set $7g_drop_bad_referer 0;
set $7g_drop_bad_query_string 0;
set $7g_drop_bad_request 0;
set $7g_drop_bad_method 0;
set $7g_drop 0;

if ($bad_bot_7g) { set $7g_reason ":bad_bot_$bad_bot_7g:"; set $7g_drop_bad_bot 1; }
#if ($bad_referer_7g) { set $7g_reason "${7g_reason}:bad_referer_${bad_referer_7g}:"; set $7g_drop_bad_referer 1; }
if ($bad_querystring_7g) { set $7g_reason "${7g_reason}:bad_querystring_${bad_querystring_7g}:"; set $7g_drop_bad_query_string 1; }
if ($bad_request_7g) { set $7g_reason "${7g_reason}:bad_request_${bad_request_7g}:"; set $7g_drop_bad_request 1; }
if ($not_allowed_method_7g) { set $7g_reason "${7g_reason}:not_allowed_method_${not_allowed_method_7g}:"; set $7g_drop_bad_method 2; }

include /etc/nginx/extra.d/*7g-context.conf;
include /var/www/example.net/nginx/*-7g-context.conf;

if ($7g_drop_bad_bot) {
    set $args "${7g_reason}";
    set $7g_drop 1;
}

if ($7g_drop_bad_referer) {
    set $args "${7g_reason}";
    set $7g_drop 1;
}

if ($7g_drop_bad_query_string) {
    set $args "${7g_reason}";
    set $7g_drop 1;
}

if ($7g_drop_bad_request) {
    set $args "${7g_reason}";
    set $7g_drop 1;
}

if ($7g_drop_bad_method) {
    set $args "${7g_reason}";
    set $7g_drop 2;
}

access_log /var/www/example.net/logs/7g.log 7g_log if=${7g_drop};

if ($7g_drop = 1) {
    return 403;
}

if ($7g_drop = 2) {
    return 405;
}
