# A real server-wide exception in use (/etc/nginx/extra.d/whitelists-7g-context.conf on a GridPane server, 2026-10-21): the
# stricter form, which lifts the block only when the rule that fired is the one the exception names (bad_request 15).
set $exclusion_rule_match "";
if ($args ~* "^action=slack_success&site_token=") {
    set $exclusion_rule_match 15;
}
if ($bad_request_7g = $exclusion_rule_match) {
    set $7g_drop_bad_request 0;
}
